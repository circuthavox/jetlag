<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233041">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jet Lag Game">
  <meta name="description" content="Jet Lag: The Game — your team's travel strategy dashboard.">
  <title>JET LAG: THE GAME</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/jpeg" href="./jetlag_favicon.jpg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Jet Lag: The Game home"><img class="brand-logo" src="./jetlag.png" alt="Jet Lag: The Game"></a>
    <div class="header-actions">
      <button id="resetGameButton" class="reset-game-button" type="button" aria-label="Reset game">Reset game</button>
      <button id="installButton" class="install-button" type="button" aria-label="Install Jet Lag: The Game">Install app <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main id="app" class="shell"><div class="loading">Loading your game…</div></main>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer><span>PLAY SMART. STAY SAFE.</span><span>Check AirTag locations separately in Apple Find My.</span></footer>
</body>
</html>
